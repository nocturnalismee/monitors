services:
  app:
    build: .
    ports:
      - "8010:80"
    environment:
      APP_ENV: production
      APP_URL: http://localhost:8010
      APP_TZ: Asia/Jakarta
      # Generate once with: php -r "echo bin2hex(random_bytes(32)), PHP_EOL;"
      APP_KEY: ${APP_KEY:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: servmon
      DB_USER: servmon
      DB_PASS: ${DB_PASSWORD:-changeme}
      REDIS_ENABLED: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - servmon_storage:/var/www/html/storage
      - servmon_config:/var/www/html/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: servmon
      MYSQL_USER: servmon
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-changeme}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "servmon", "-p${DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  servmon_storage:
  servmon_config:
  db_data:
  redis_data:
